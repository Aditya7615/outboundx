name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: outboundx
          MYSQL_USER: outboundx
          MYSQL_PASSWORD: outboundx
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uoutboundx -poutboundx --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://outboundx:outboundx@127.0.0.1:3306/outboundx
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      WEBHOOK_SECRET: ci-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w backend
      - run: npm run db:migrate -w backend
      - run: npm run db:seed -w backend
      - run: npm run lint -w backend
      - run: npm run typecheck -w backend
      - run: npm run test -w backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w frontend
      - run: npm run lint -w frontend
      - run: npm run build -w frontend

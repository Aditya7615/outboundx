name: outboundx

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-outboundx}
      MYSQL_USER: ${MYSQL_USER:-outboundx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-outboundx}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-outboundx}:${MYSQL_PASSWORD:-outboundx}@db:3306/${MYSQL_DATABASE:-outboundx}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-please}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: "false"
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret-change-me}
      CRON_SECRET: ${CRON_SECRET:-local-cron-secret-change-me}
      LOG_LEVEL: info
      SEED_DEMO: "true"
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
